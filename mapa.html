<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mapa da FGC - FGC HUB</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.Default.min.css">
<style>
:root{--bg:#16171b;--card:#1f2026;--txt:#eee;--mut:#9aa0ab;--red:#d32323;}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font-family:system-ui,-apple-system,sans-serif;display:flex;height:100vh}
aside{width:320px;display:flex;flex-direction:column;border-right:1px solid #2c2e36}
header{padding:12px;display:grid;gap:8px}
h1{font-size:18px;margin:0}
input,select{background:var(--card);color:var(--txt);border:1px solid #33353e;border-radius:6px;padding:8px}
#lista{overflow:auto;flex:1;padding:0 12px 12px}
.item{background:var(--card);border-radius:8px;padding:10px;margin-bottom:8px;cursor:pointer;border-left:3px solid var(--red)}
.item small{color:var(--mut);display:block;margin-top:2px}
#map{flex:1}
.pin{width:14px;height:14px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 6px #000;background:var(--red)}
footer{padding:8px 12px;font-size:11px;color:var(--mut)}
.leaflet-popup-content{color:#111}
@media(max-width:700px){body{flex-direction:column-reverse}aside{width:100%;height:40vh}}
</style>
</head>
<body>
<aside>
  <header>
    <div style="display:flex;justify-content:space-between;align-items:center;">
      <h1>Mapa da FGC</h1>
      <a href="index.html" style="color:var(--mut);text-decoration:none;font-size:12px;font-weight:bold;">← Voltar ao HUB</a>
    </div>
    <input id="busca" placeholder="Buscar local ou cidade">
    <select id="uf"><option value="">Todas as UFs</option></select>
  </header>
  <div id="lista"></div>
  <footer>Créditos: Kinomoto / Odakechi / CarolTheQueen — "Locals no Brasil".</footer>
</aside>
<div id="map"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/leaflet.markercluster.min.js"></script>
<script>
const norm = s => (s||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase();
const esc = s => String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const icon = () => L.divIcon({className:"",html:`<div class="pin"></div>`,iconSize:[18,18]});

const map = L.map("map").setView([-14.2,-51.9],4);
L.tileLayer("https://{s}.basemaps.cartocdn.com/rastertiles/dark_all/{z}/{x}/{y}{r}.png?key=cb1_4w1g_1_3040de64ae82136aecda67bf",{
  attribution:"&copy; OpenStreetMap &copy; CARTO",maxZoom:18}).addTo(map);

const gLocals = L.markerClusterGroup({showCoverageOnHover:false,maxClusterRadius:30}).addTo(map);
const markers = new Map();

function popupLocal(l){
  return `<b>${esc(l.nome)}</b><br>${esc(l.cidade)} - ${esc(l.uf)}`
    +(l.aprox?`<br><i>posição aproximada</i>`:"")
    +(l.link?`<br><a href="${esc(l.link)}" target="_blank" rel="noopener">Link</a>`:"");
}

fetch("locals.json").then(r=>r.json()).then(d=>{
  const ufs = [...new Set(d.map(l=>l.uf))].sort();
  document.getElementById("uf").innerHTML += ufs.map(u=>`<option>${u}</option>`).join("");
  d.forEach(l=>{
    const m = L.marker([l.lat, l.lng], {icon: icon()}).bindPopup(popupLocal(l));
    markers.set("l" + l.id, {marker: m, data: l});
  });
  render(); aplicarQuery();
});

function filtrados(){
  const q = norm(document.getElementById("busca").value), uf = document.getElementById("uf").value;
  return [...markers.entries()].filter(([k,v])=>{
    if(uf && v.data.uf !== uf) return false;
    if(q && !norm(v.data.nome + " " + v.data.cidade).includes(q)) return false;
    return true;
  });
}

function render(){
  gLocals.clearLayers();
  const lista = document.getElementById("lista"); lista.innerHTML = "";
  const itensOrdenados = filtrados().sort((a, b) => a[1].data.nome.localeCompare(b[1].data.nome, 'pt-BR'));

  itensOrdenados.forEach(([k,v])=>{
    gLocals.addLayer(v.marker);
    const el = document.createElement("div");
    el.className = "item";
    el.innerHTML = `<b>${esc(v.data.nome)}</b><small>📍 ${esc(v.data.cidade)} - ${esc(v.data.uf)}</small>`;
    el.onclick = () => { map.setView([v.data.lat, v.data.lng], 12); gLocals.zoomToShowLayer(v.marker, ()=>v.marker.openPopup()); };
    lista.appendChild(el);
  });
}

["busca","uf"].forEach(id => document.getElementById(id).addEventListener("input", render));

function aplicarQuery(){
  const p = new URLSearchParams(location.search);
  const cidade = p.get("cidade"), local = p.get("local");
  if(local && markers.has("l" + local)){
    const {marker, data} = markers.get("l" + local);
    map.setView([data.lat, data.lng], 12); gLocals.zoomToShowLayer(marker, () => marker.openPopup()); return;
  }
  if(cidade){
    const pts = [...markers.values()].filter(v => norm(v.data.cidade) === norm(cidade)).map(v => [v.data.lat, v.data.lng]);
    if(pts.length) map.fitBounds(L.latLngBounds(pts).pad(0.5), {maxZoom: 11});
    document.getElementById("busca").value = cidade; render();
  }
}
</script>
</body>
</html>
