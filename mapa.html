<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mapa da FGC - FGC HUB</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.Default.min.css">
<style>
:root{--bg:#0f1015;--card:#181920;--txt:#f1f3f5;--mut:#909296;--red:#dc2626;--blue:#2563eb;--border:#272932}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font-family:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif;display:flex;height:100vh}
aside{width:340px;display:flex;flex-direction:column;border-right:1px solid var(--border);background:#12131a}
header{padding:14px;display:grid;gap:10px;border-bottom:1px solid var(--border)}
.head-title{display:flex;align-items:center;justify-content:space-between}
h1{font-size:18px;margin:0;font-weight:700;color:#fff}
.back-btn{color:var(--mut);text-decoration:none;font-size:13px;display:inline-flex;align-items:center;gap:4px;font-weight:600}
.back-btn:hover{color:#ef4444}
input,select{background:var(--card);color:var(--txt);border:1px solid var(--border);border-radius:6px;padding:9px 12px;font-size:14px;outline:none}
input:focus,select:focus{border-color:var(--red)}
.toggles{display:flex;gap:12px}
label{font-size:13px;color:var(--mut);display:flex;gap:6px;align-items:center;cursor:pointer;user-select:none}
#lista{overflow-y:auto;flex:1;padding:12px}
.item{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:12px;margin-bottom:10px;cursor:pointer;border-left:4px solid var(--red);transition:transform 0.1s ease,border-color 0.1s ease}
.item:hover{transform:translateX(2px);border-color:#3f4251}
.item.ev{border-left-color:var(--blue)}
.item b{display:block;font-size:14px;color:#fff;margin-bottom:4px}
.item small{color:var(--mut);font-size:12px;display:block}
#map{flex:1;background:#0b0c0f}
.pin{width:14px;height:14px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 8px rgba(0,0,0,0.6)}
.pin.l{background:var(--red)}
.pin.e{background:var(--blue);width:18px;height:18px;box-shadow:0 0 10px rgba(37,99,235,0.8)}
footer{padding:10px 14px;font-size:11px;color:var(--mut);border-top:1px solid var(--border);background:#0f1015}
.leaflet-popup-content-wrapper{background:var(--card);color:var(--txt);border:1px solid var(--border);border-radius:8px}
.leaflet-popup-tip{background:var(--card)}
.leaflet-popup-content{margin:12px;font-size:13px;line-height:1.4}
.leaflet-popup-content a{color:#60a5fa;text-decoration:none;font-weight:600}
.leaflet-popup-content a:hover{text-decoration:underline}
@media(max-width:768px){body{flex-direction:column-reverse}aside{width:100%;height:45vh}}
</style>
</head>
<body>
<aside>
  <header>
    <div class="head-title">
      <h1>Mapa da FGC</h1>
      <a href="index.html" class="back-btn">← Voltar ao HUB</a>
    </div>
    <input id="busca" placeholder="Buscar local ou cidade...">
    <select id="uf"><option value="">Todas as UFs</option></select>
    <div class="toggles">
      <label><input type="checkbox" id="tLocals" checked> Locals (40)</label>
      <label><input type="checkbox" id="tEventos" checked> Eventos Offline</label>
    </div>
  </header>
  <div id="lista"></div>
  <footer>Créditos: Kinomoto / Odakechi — "Locals no Brasil".</footer>
</aside>
<div id="map"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/leaflet.markercluster.min.js"></script>
<script>
const norm = s => (s||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase();
const esc = s => String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const icon = cls => L.divIcon({className:"",html:`<div class="pin ${cls}"></div>`,iconSize:[18,18]});

const map = L.map("map").setView([-14.235, -51.925], 4);
L.tileLayer("https://{s}.basemaps.cartocdn.com/rastertiles/dark_all/{z}/{x}/{y}{r}.png?key=cb1_4w1g_1_3040de64ae82136aecda67bf",{
  attribution:"&copy; OpenStreetMap &copy; CARTO",maxZoom:18}).addTo(map);

const gLocals = L.markerClusterGroup({showCoverageOnHover:false, maxClusterRadius:30}).addTo(map);
const gEventos = L.layerGroup().addTo(map);
const markers = new Map();

let EVENTOS = [
  {slug:"battle-coliseum-2026", nome:"Battle Coliseum 2026", cidade:"São Paulo", uf:"SP", lat:-23.5505, lng:-46.6333, data:"20/11/2026", url:"#"}
];

function popupLocal(l){
  return `<b>${esc(l.nome)}</b><br>📍 ${esc(l.cidade)} - ${esc(l.uf)}`
    +(l.aprox?`<br><small style="color:#aaa">*Posição aproximada</small>`:"")
    +(l.link?`<br><br><a href="${esc(l.link)}" target="_blank" rel="noopener">Mais informações →</a>`:"");
}

function popupEvento(e){
  return `<b style="color:#60a5fa">${esc(e.nome)}</b><br>📅 ${esc(e.data)}<br>📍 ${esc(e.cidade)} - ${esc(e.uf)}`
    +(e.url ? `<br><br><a href="${esc(e.url)}" target="_blank">Ver detalhes no Start.gg →</a>` : "");
}

async function init(){
  try {
    const res = await fetch("locals.json");
    const locals = await res.json();
    
    const ufs = [...new Set(locals.map(l=>l.uf))].sort();
    document.getElementById("uf").innerHTML += ufs.map(u=>`<option value="${u}">${u}</option>`).join("");

    locals.forEach(l=>{
      const m = L.marker([l.lat, l.lng], {icon: icon("l")}).bindPopup(popupLocal(l));
      markers.set("l"+l.id, {marker: m, data: l, tipo: "l"});
    });

    EVENTOS.forEach(e=>{
      if(e.lat && e.lng){
        const m = L.marker([e.lat, e.lng], {icon: icon("e"), zIndexOffset: 1000}).bindPopup(popupEvento(e));
        markers.set("e"+e.slug, {marker: m, data: e, tipo: "e"});
      }
    });

    render();
    aplicarQuery();
  } catch(err) {
    console.error("Erro ao carregar mapa:", err);
  }
}

function filtrados(){
  const q = norm(document.getElementById("busca").value);
  const uf = document.getElementById("uf").value;
  const tl = document.getElementById("tLocals").checked;
  const te = document.getElementById("tEventos").checked;

  return [...markers.entries()].filter(([k, v])=>{
    if(v.tipo === "l" && !tl) return false;
    if(v.tipo === "e" && !te) return false;
    if(uf && v.data.uf !== uf) return false;
    if(q && !norm(v.data.nome + " " + v.data.cidade).includes(q)) return false;
    return true;
  });
}

function render(){
  gLocals.clearLayers(); 
  gEventos.clearLayers();
  const lista = document.getElementById("lista"); 
  lista.innerHTML = "";

  filtrados().forEach(([k, v])=>{
    (v.tipo === "l" ? gLocals : gEventos).addLayer(v.marker);
    const el = document.createElement("div");
    el.className = "item" + (v.tipo === "e" ? " ev" : "");
    el.innerHTML = `<b>${esc(v.data.nome)}</b><small>📍 ${esc(v.data.cidade)} - ${esc(v.data.uf)}${v.tipo === "e" ? " · Evento (" + esc(v.data.data) + ")" : ""}</small>`;
    el.onclick = () => {
      map.setView([v.data.lat, v.data.lng], 12);
      if(v.tipo === "l") gLocals.zoomToShowLayer(v.marker, () => v.marker.openPopup());
      else v.marker.openPopup();
    };
    lista.appendChild(el);
  });
}

["busca", "uf", "tLocals", "tEventos"].forEach(id => document.getElementById(id).addEventListener("input", render));

function aplicarQuery(){
  const p = new URLSearchParams(location.search);
  const cidade = p.get("cidade");
  const evento = p.get("evento");
  const local = p.get("local");

  if(local && markers.has("l" + local)){
    const {marker, data} = markers.get("l" + local);
    map.setView([data.lat, data.lng], 12);
    gLocals.zoomToShowLayer(marker, () => marker.openPopup());
    return;
  }
  if(evento && markers.has("e" + evento)){
    const {marker, data} = markers.get("e" + evento);
    map.setView([data.lat, data.lng], 12);
    marker.openPopup();
    return;
  }
  if(cidade){
    const pts = [...markers.values()].filter(v => norm(v.data.cidade) === norm(cidade)).map(v => [v.data.lat, v.data.lng]);
    if(pts.length) map.fitBounds(L.latLngBounds(pts).pad(0.4), {maxZoom: 11});
    document.getElementById("busca").value = cidade;
    render();
  }
}

init();
</script>
</body>
</html>
