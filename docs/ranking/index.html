<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ranking Tekken 8 — Brasil</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="wrap">
  <h1>Ranking Tekken 8 — Brasil</h1>

  <div class="card">
    <div class="meta">
      <div class="toggle" id="toggle">
        <button data-m="online" class="online act">ONLINE</button>
        <button data-m="offline" class="offline">OFFLINE</button>
      </div>
      <div class="pts" id="pointsInfo">1º 16 · 2º 12 · 3º 10 · 4º 8 · 5-7 6 · 8-12 4 · 13-16 2</div>
    </div>
    <div id="count" class="pts" style="margin-bottom:8px"></div>
    <div id="status" class="pts"></div>
    <div class="table-wrap">
      <table>
        <thead><tr><th class="pos">#</th><th>Player</th><th class="n">Pontos</th><th class="n">Eventos</th><th class="n">Melhor</th></tr></thead>
        <tbody id="body"></tbody>
      </table>
    </div>
  </div>
</div>

<script src="js/app.js"></script>
</body>
</html>
