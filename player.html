<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil do Player | FGC HUB</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="buscar-style.css">
</head>
<body class="p-4 md:p-10">

    <div class="max-w-5xl mx-auto">
        <a href="buscar.html" class="text-slate-400 hover:text-red-500 text-sm mb-6 inline-block">&larr; Voltar para a busca</a>

        <div id="perfil_conteudo">
            <div class="loading-attendees"><div class="spinner"></div><p style="margin-top:15px;">Carregando perfil...</p></div>
        </div>
    </div>

    <script src="script.js"></script>
    <script src="players.js"></script>
    <script>
        (function() {
            if (window._playerLoaded) {
                console.log('Perfil já carregado.');
                return;
            }
            window._playerLoaded = true;

            const params = new URLSearchParams(window.location.search);
            const playerId = params.get('id');
            const gamerTag = params.get('tag') || 'Player';
            const conteudo = document.getElementById('perfil_conteudo');

            function formatDate(timestamp) {
                if (!timestamp) return '—';
                const d = new Date(timestamp * 1000);
                return d.toLocaleDateString('pt-BR', { day: '2-digit', month: 'short', year: 'numeric' });
            }

            function montarHtmlPerfil(dados, fonte) {
                const {
                    gamerTag, user, totalWins, totalLosses, winrateAllTime, winrateLast6Months,
                    wins6m, losses6m, recentForm, highlights, tournaments
                } = dados;

                const nomeReal = user?.name || '';
                const bio = user?.bio || '';
                const country = user?.location?.country || '';
                const city = user?.location?.city || '';
                const localizacao = [city, country].filter(Boolean).join(', ') || 'Localização não informada';
                const avatarUrl = user?.avatarUrl || '';

                const wrClass = winrateAllTime >= 60 ? 'text-green-500' : (winrateAllTime >= 40 ? 'text-yellow-500' : 'text-red-500');

                // Banner com gradiente (futuramente pode ser imagem)
                const bannerStyle = 'background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);';
                const avatarHtml = avatarUrl 
                    ? `<img src="${avatarUrl}" alt="${gamerTag}" class="profile-avatar">` 
                    : `<div class="profile-avatar-placeholder">${gamerTag.charAt(0)}</div>`;

                // ===== RECENT EVENTS (com imagem de fundo) =====
                const recentEvents = tournaments.slice(0, 10).map(t => {
                    const bgImage = t.imageUrl ? `background-image: url('${t.imageUrl}');` : '';
                    const bgColor = t.imageUrl ? '' : 'background: #1a1a2e;';
                    return `
                        <div class="recent-event-card" style="${bgImage} ${bgColor}">
                            <div class="recent-event-overlay"></div>
                            <div class="recent-event-content">
                                <div class="recent-event-name">${t.eventName}</div>
                                <div class="recent-event-placement ${t.winrate >= 60 ? 'text-green-500' : (t.winrate >= 40 ? 'text-yellow-500' : 'text-red-500')}">
                                    ${t.placement}º
                                </div>
                                <div class="recent-event-detail">${t.wins}W - ${t.losses}L</div>
                            </div>
                        </div>
                    `;
                }).join('') || '<div class="text-slate-500 text-sm col-span-full">Nenhum torneio recente.</div>';

                // ===== HIGHLIGHTS =====
                const highlightsHtml = highlights.length === 0 
                    ? '<div class="text-slate-500 text-sm">Nenhum destaque encontrado.</div>'
                    : highlights.map(h => `
                        <div class="highlight-item">
                            <span class="placement">${h.placement}</span>
                            <span class="event">${h.eventName}</span>
                            <span class="date">${h.date}</span>
                        </div>
                    `).join('');

                // ===== EVENTS (lista completa) =====
                const eventsHtml = tournaments.slice(0, 15).map(t => `
                    <div class="event-row">
                        <div class="event-name-wrapper">
                            ${t.imageUrl ? `<img src="${t.imageUrl}" class="event-thumb" alt="${t.eventName}">` : ''}
                            <span class="event-name">${t.eventName}</span>
                        </div>
                        <span class="event-placement ${t.winrate >= 60 ? 'text-green-500' : (t.winrate >= 40 ? 'text-yellow-500' : 'text-red-500')}">
                            ${t.placement}º / ${t.attendees}
                        </span>
                        <span class="event-record">${t.wins}W - ${t.losses}L (${t.winrate}%)</span>
                        <span class="event-date">${t.date}</span>
                    </div>
                `).join('') || '<div class="text-slate-500 text-sm">Nenhum evento encontrado.</div>';

                return `
                    <div class="player-profile">
                        <!-- HEADER -->
                        <div class="profile-header">
                            <div class="profile-avatar-wrapper">
                                ${avatarHtml}
                            </div>
                            <div class="profile-info">
                                <div class="profile-name-row">
                                    <h1 class="profile-gamertag">${gamerTag}</h1>
                                    <div class="winrate-badge ${wrClass}">${winrateAllTime}%</div>
                                    <div class="record-badge">${totalWins}W - ${totalLosses}L</div>
                                    <span class="text-xs text-slate-500 ml-auto">${fonte === 'cache' ? '⚡ em cache' : '🔴 ao vivo'}</span>
                                    <button onclick="atualizarDados()" class="text-xs bg-red-600 hover:bg-red-700 text-white px-3 py-1 rounded transition">
                                        <i class="fa-solid fa-rotate"></i> Atualizar
                                    </button>
                                </div>
                                ${nomeReal ? `<div class="profile-real-name">${nomeReal}</div>` : ''}
                                <div class="profile-location"><i class="fa-solid fa-location-dot"></i> ${localizacao}</div>
                                ${bio ? `<div class="profile-bio">"${bio}"</div>` : ''}
                            </div>
                        </div>

                        <!-- STATS: apenas eventos -->
                        <div class="profile-summary">
                            <div class="stat-card">
                                <span class="label">EVENTS</span>
                                <span class="value text-blue-400">${tournaments.length}</span>
                                <span class="record">torneios</span>
                            </div>
                        </div>

                        <!-- RECENT EVENTS -->
                        <div class="recent-events">
                            <h3>RECENT EVENTS</h3>
                            <div class="recent-events-grid">
                                ${recentEvents}
                            </div>
                        </div>

                        <!-- HIGHLIGHTS -->
                        <div class="highlights">
                            <h3>HIGHLIGHTS</h3>
                            <div class="highlights-container">
                                ${highlightsHtml}
                            </div>
                        </div>

                        <!-- ABAS -->
                        <div class="profile-tabs">
                            <div class="tab-header">
                                <span class="tab-btn active" data-tab="events">EVENTS</span>
                                <span class="tab-btn" data-tab="versus">VERSUS</span>
                                <span class="tab-btn" data-tab="vods">VODS</span>
                            </div>
                            <div class="tab-content" id="tab-events">
                                ${eventsHtml}
                            </div>
                            <div class="tab-content" id="tab-versus" style="display:none;">
                                <div class="text-slate-500 text-sm">Em breve: confrontos diretos.</div>
                            </div>
                            <div class="tab-content" id="tab-vods" style="display:none;">
                                <div class="text-slate-500 text-sm">Em breve: VODs.</div>
                            </div>
                        </div>
                    </div>
                `;
            }

            async function carregarPerfil(forceRefresh = false) {
                if (!playerId) {
                    conteudo.innerHTML = '<div class="history-empty">Player não especificado na URL.</div>';
                    return;
                }
                try {
                    conteudo.innerHTML = '<div class="loading-attendees"><div class="spinner"></div><p style="margin-top:15px;">Carregando perfil...</p></div>';
                    const { dados, fonte } = await obterDadosPlayer(playerId, gamerTag, forceRefresh);
                    conteudo.innerHTML = '';
                    conteudo.innerHTML = montarHtmlPerfil(dados, fonte);

                    document.querySelectorAll('.tab-btn').forEach(btn => {
                        btn.addEventListener('click', function() {
                            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                            this.classList.add('active');
                            const target = this.dataset.tab;
                            document.querySelectorAll('.tab-content').forEach(c => c.style.display = 'none');
                            document.getElementById('tab-' + target).style.display = 'block';
                        });
                    });
                } catch (e) {
                    console.error(e);
                    conteudo.innerHTML = '<div class="history-empty">❌ Erro ao carregar perfil do player.</div>';
                }
            }

            window.atualizarDados = function() {
                carregarPerfil(true);
            };

            carregarPerfil(false);
        })();
    </script>
</body>
</html>
