<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil do Player | FGC HUB</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="buscar-style.css">
</head>
<body class="p-4 md:p-10">

    <div class="max-w-5xl mx-auto">
        <a href="buscar.html" class="text-slate-400 hover:text-red-500 text-sm mb-6 inline-block">&larr; Voltar para a busca</a>

        <div id="perfil_conteudo">
            <div class="loading-attendees"><div class="spinner"></div><p style="margin-top:15px;">Carregando perfil...</p></div>
        </div>
    </div>

    <script src="script.js"></script>
    <script src="players.js"></script>
    <script>
        (function() {
            if (window._playerLoaded) {
                console.log('Perfil já carregado.');
                return;
            }
            window._playerLoaded = true;

            const params = new URLSearchParams(window.location.search);
            const playerId = params.get('id');
            const gamerTag = params.get('tag') || 'Player';
            const conteudo = document.getElementById('perfil_conteudo');

            function getDotClass(placement) {
                if (placement === 1) return 'dot-1st';
                if (placement <= 3) return 'dot-top3';
                if (placement <= 8) return 'dot-top8';
                return 'dot-other';
            }

            function formatDate(timestamp) {
                if (!timestamp) return '—';
                const d = new Date(timestamp * 1000);
                return d.toLocaleDateString('pt-BR', { day: '2-digit', month: 'short', year: 'numeric' });
            }

            function montarHtmlPerfil(dados, fonte) {
                const {
                    gamerTag, totalWins, totalLosses, winrateAllTime, winrateLast6Months,
                    wins6m, losses6m, recentForm, highlights, tournaments
                } = dados;

                const wrClass = winrateAllTime >= 60 ? 'text-green-500' : (winrateAllTime >= 40 ? 'text-yellow-500' : 'text-red-500');

                const eventsHtml = tournaments.slice(0, 15).map(t => `
                    <div class="event-row">
                        <span class="event-name">${t.name}</span>
                        <span class="event-placement ${t.winrate >= 60 ? 'text-green-500' : (t.winrate >= 40 ? 'text-yellow-500' : 'text-red-500')}">
                            ${t.placement}º / ${t.attendees}
                        </span>
                        <span class="event-record">${t.wins}W - ${t.losses}L (${t.winrate}%)</span>
                        <span class="event-date">${t.date}</span>
                    </div>
                `).join('') || '<div class="text-slate-500 text-sm">Nenhum evento encontrado.</div>';

                return `
                    <div class="player-profile">
                        <!-- HEADER -->
                        <div class="profile-header">
                            <h1 class="profile-gamertag">${gamerTag}</h1>
                            <div class="winrate-badge ${wrClass}">${winrateAllTime}%</div>
                            <div class="record-badge">${totalWins}W - ${totalLosses}L</div>
                            <span class="text-xs text-slate-500 ml-auto">${fonte === 'cache' ? '⚡ em cache' : '🔴 ao vivo'}</span>
                            <button onclick="atualizarDados()" class="text-xs bg-red-600 hover:bg-red-700 text-white px-3 py-1 rounded transition">
                                <i class="fa-solid fa-rotate"></i> Atualizar dados
                            </button>
                        </div>

                        <!-- RECENT FORM (bolinhas) -->
                        <div class="recent-form">
                            <h3>RECENT FORM</h3>
                            <div class="form-dots">
                                ${recentForm.map(pos => `<span class="form-dot ${getDotClass(pos)}">${pos}</span>`).join('')}
                            </div>
                        </div>

                        <!-- HIGHLIGHTS -->
                        <div class="highlights">
                            <h3>HIGHLIGHTS</h3>
                            ${highlights.length === 0 ? '<div class="text-slate-500 text-sm">Nenhum destaque encontrado.</div>' : ''}
                            ${highlights.map(h => `
                                <div class="highlight-item">
                                    <span class="placement">${h.placement}</span>
                                    <span class="event">${h.eventName}</span>
                                    <span class="date">${h.date}</span>
                                </div>
                            `).join('')}
                        </div>

                        <!-- ABAS -->
                        <div class="profile-tabs">
                            <div class="tab-header">
                                <span class="tab-btn active" data-tab="events">EVENTS</span>
                                <span class="tab-btn" data-tab="versus">VERSUS</span>
                                <span class="tab-btn" data-tab="vods">VODS</span>
                            </div>
                            <div class="tab-content" id="tab-events">
                                ${eventsHtml}
                            </div>
                            <div class="tab-content" id="tab-versus" style="display:none;">
                                <div class="text-slate-500 text-sm">Em breve: confrontos diretos.</div>
                            </div>
                            <div class="tab-content" id="tab-vods" style="display:none;">
                                <div class="text-slate-500 text-sm">Em breve: VODs.</div>
                            </div>
                        </div>
                    </div>
                `;
            }

            async function carregarPerfil(forceRefresh = false) {
                if (!playerId) {
                    conteudo.innerHTML = '<div class="history-empty">Player não especificado na URL.</div>';
                    return;
                }
                try {
                    conteudo.innerHTML = '<div class="loading-attendees"><div class="spinner"></div><p style="margin-top:15px;">Carregando perfil...</p></div>';
                    const { dados, fonte } = await obterDadosPlayer(playerId, gamerTag, forceRefresh);
                    conteudo.innerHTML = '';
                    conteudo.innerHTML = montarHtmlPerfil(dados, fonte);

                    // Reatribui os eventos das abas
                    document.querySelectorAll('.tab-btn').forEach(btn => {
                        btn.addEventListener('click', function() {
                            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                            this.classList.add('active');
                            const target = this.dataset.tab;
                            document.querySelectorAll('.tab-content').forEach(c => c.style.display = 'none');
                            document.getElementById('tab-' + target).style.display = 'block';
                        });
                    });
                } catch (e) {
                    console.error(e);
                    conteudo.innerHTML = '<div class="history-empty">❌ Erro ao carregar perfil do player.</div>';
                }
            }

            // Função global para ser chamada pelo botão
            window.atualizarDados = function() {
                carregarPerfil(true);
            };

            // Inicializa
            carregarPerfil(false);
        })();
    </script>
</body>
</html>
