<body class="p-4 md:p-10">

    <div class="max-w-3xl mx-auto">
        <a href="index.html" class="text-slate-400 hover:text-red-500 text-sm mb-6 inline-block">&larr; Voltar para o FGC HUB</a>

        <div class="text-center mb-10">
            <h1 class="text-3xl md:text-4xl font-black text-white uppercase italic">Buscar <span class="text-red-600">Player</span></h1>
            <p class="text-slate-400 text-sm mt-2">Players carregados da lista de inscritos.</p>
        </div>

        <section class="glass-card p-4 md:p-5 rounded-xl mb-6" aria-labelledby="importar_evento_titulo">
            <h2 id="importar_evento_titulo" class="text-white font-bold text-sm uppercase mb-2">
                <i class="fa-solid fa-cloud-arrow-down text-red-500 mr-2" aria-hidden="true"></i>Importar inscritos de um evento
            </h2>
            <p class="text-slate-400 text-xs mb-3">Cole o link completo do evento no Start.gg. Players já cadastrados no HUB serão ignorados.</p>
            <div class="flex flex-col sm:flex-row gap-2">
                <input id="link_evento_input" type="url" inputmode="url" autocomplete="url"
                       placeholder="https://www.start.gg/tournament/.../event/..."
                       aria-label="Link do evento no Start.gg"
                       class="bg-slate-950/60 border border-slate-700 rounded-lg flex-1 min-w-0 outline-none text-white placeholder-slate-500 px-3 py-3 focus:border-red-600" />
                <button id="btn_importar_evento" type="button"
                        class="bg-red-700 hover:bg-red-600 disabled:opacity-50 disabled:cursor-not-allowed text-white font-bold text-xs uppercase rounded-lg px-4 py-3 transition">
                    Importar inscritos
                </button>
            </div>
            <p id="status_importacao_evento" class="text-xs mt-3 text-slate-400" role="status" aria-live="polite"></p>
        </section>

        <div class="glass-card p-3 rounded-xl mb-8 flex items-center gap-3">
            <i class="fa-solid fa-magnifying-glass text-slate-500 pl-2" aria-hidden="true"></i>
            <input id="busca_input" type="text" placeholder="Digite o gamertag do player..." autocomplete="off"
                   class="bg-transparent flex-1 outline-none text-white placeholder-slate-500 py-2" />
        </div>

        <div class="flex justify-between items-center mb-4 flex-wrap gap-2">
            <button id="btn_mostrar_salvos" class="text-xs text-slate-500 hover:text-red-400 transition">
                <i class="fa-solid fa-database"></i> Mostrar players salvos (<span id="contador_salvos">0</span>)
            </button>
            <button id="btn_mostrar_times" class="text-xs text-slate-500 hover:text-red-400 transition">
                <i class="fa-solid fa-shield-halved"></i> Buscar por time
            </button>
        </div>

        <div id="grid_times" class="hidden glass-card p-4 rounded-xl mb-6">
            <div id="conteudo_times" class="grid grid-cols-4 sm:grid-cols-5 md:grid-cols-6 gap-3"></div>
        </div>

        <div id="lista_salvos" class="hidden glass-card p-4 rounded-xl mb-4 max-h-60 overflow-y-auto">
            <p class="text-xs text-slate-400 mb-2">Players salvos localmente:</p>
            <div id="conteudo_salvos" class="text-sm text-white space-y-1"></div>
        </div>

        <div id="resultados_busca" class="space-y-2">
            <div class="text-slate-500 text-sm text-center py-8">Digite um nome para buscar</div>
        </div>
    </div>

        function extrairTagsDoPrefix(prefix) {
            return String(prefix || '')
                .split(/[|/&]/)
                .map(t => t.trim().toLowerCase())
                .filter(Boolean);
        }

        function extrairSlugEventoStartGG(valor) {
            let url;
            try {
                const link = valor.trim();
                url = new URL(/^https?:\/\//i.test(link) ? link : `https://${link}`);
            } catch (e) {
                throw new Error('Informe um link válido de evento do Start.gg.');
            }
            if (!['start.gg', 'www.start.gg'].includes(url.hostname.toLowerCase())) {
                throw new Error('O link precisa ser de um evento no domínio start.gg.');
            }
            const partes = url.pathname.split('/').filter(Boolean);
            if (partes[0]?.toLowerCase() !== 'tournament' || partes[2]?.toLowerCase() !== 'event' || !partes[3]) {
                throw new Error('Cole o link completo do evento (ex.: start.gg/tournament/nome/event/nome-do-evento).');
            }
            return partes.slice(0, 4).join('/');
        }

        async function buscarInscritosDoEvento(eventSlug) {
            const porPagina = 100;
            const query = `query ImportarInscritosEvento($slug:String!,$page:Int!,$perPage:Int!){event(slug:$slug){id name entrants(query:{page:$page,perPage:$perPage}){pageInfo{total} nodes{id name participants{gamerTag prefix player{id gamerTag prefix}}}}}}`;
            const todos = [];
            let nomeEvento = 'evento';
            let pagina = 1;
            let total = null;

            do {
                statusImportacaoEvento.textContent = total === null
                    ? `Buscando inscritos do evento (página ${pagina})...`
                    : `Buscando inscritos do evento: página ${pagina} de ${Math.max(1, Math.ceil(total / porPagina))}...`;
                const resposta = await callStartGG(query, { slug: eventSlug, page: pagina, perPage: porPagina });
                if (resposta.errors?.length) {
                    throw new Error(resposta.errors.map(erro => erro.message).filter(Boolean).join(' ') || 'A API do Start.gg retornou um erro.');
                }
                const evento = resposta.data?.event;
                if (!evento) throw new Error('Evento não encontrado ou indisponível no Start.gg.');
                nomeEvento = evento.name || nomeEvento;
                const inscritos = evento.entrants || {};
                const nodes = inscritos.nodes || [];
                const totalDaResposta = Number(inscritos.pageInfo?.total ?? (todos.length + nodes.length));
                if (nodes.length === 0 && todos.length < totalDaResposta) {
                    throw new Error('A API do Start.gg não retornou a próxima página de inscritos. Tente novamente.');
                }
                todos.push(...nodes);
                total = totalDaResposta;
                pagina++;
            } while (todos.length < total && pagina <= 500);

            if (todos.length < total) {
                throw new Error('Não foi possível carregar todas as páginas de inscritos. Tente novamente.');
            }
            return { nomeEvento, entrants: todos };
        }

        btnImportarEvento.addEventListener('click', async () => {
            const valor = linkEventoInput.value.trim();
            if (!valor) {
                statusImportacaoEvento.textContent = 'Cole o link do evento para começar.';
                linkEventoInput.focus();
                return;
            }

            btnImportarEvento.disabled = true;
            try {
                const slug = extrairSlugEventoStartGG(valor);
                const { nomeEvento, entrants } = await buscarInscritosDoEvento(slug);
                const players = entrants.flatMap(entrant => (entrant.participants || []).map(participant => ({
                    playerId: participant.player?.id,
                    gamerTag: participant.player?.gamerTag || participant.gamerTag || ((entrant.participants || []).length === 1 ? entrant.name : ''),
                    prefix: participant.player ? (participant.player.prefix || '') : (participant.prefix || '')
                })));
                const resultado = await importarPlayersConhecidos(players);
                await carregarDados();
                statusImportacaoEvento.textContent = `${nomeEvento}: ${resultado.adicionados} player(s) novo(s) salvo(s); ${resultado.prefixosAtualizados} prefixo(s) de sponsor atualizado(s); ${resultado.jaExistiam} já estavam no banco; ${resultado.semId} sem ID ou nick foram ignorados.`;
            } catch (erro) {
                console.error('Erro ao importar inscritos do evento:', erro);
                statusImportacaoEvento.textContent = erro.message || 'Não foi possível importar os inscritos. Confira o link e tente novamente.';
            } finally {
                btnImportarEvento.disabled = false;
            }
        });

        let timesRenderizados = [];

        function renderizarGridTimes() {
            const prefixosComPlayer = new Set();
            listaCompleta.forEach(p => extrairTagsDoPrefix(p.prefix).forEach(t => prefixosComPlayer.add(t)));

            timesRenderizados = TEAMS.filter(t =>
                t.tags.some(tag => prefixosComPlayer.has(tag.trim().toLowerCase()))
            );
            if (timesRenderizados.length === 0) {
                conteudoTimes.innerHTML = '<span class="col-span-full text-slate-500 text-xs text-center py-4">Nenhum time com player cadastrado.</span>';
                return;
            }
            conteudoTimes.innerHTML = timesRenderizados.map((t, idx) => `
                <button id="time_btn_${idx}" onclick="buscarPorTime(${idx})" title="${t.label}" class="flex items-center justify-center p-2 h-16 rounded-lg border border-slate-700 hover:border-red-500 bg-slate-800/50 transition">
                    <img src="${t.logo}" alt="${t.label}" class="max-w-full max-h-10 object-contain">
                </button>
            `).join('');
        }

        window.buscarPorTime = function(idx) {
            const time = timesRenderizados[idx];
            if (!time) return;

            document.querySelectorAll('#conteudo_times button').forEach(btn => {
                btn.classList.remove('border-red-500', 'bg-slate-800');
                btn.classList.add('border-slate-700', 'bg-slate-800/50');
            });
            const btnSelecionado = document.getElementById('time_btn_' + idx);
            if (btnSelecionado) {
                btnSelecionado.classList.remove('border-slate-700', 'bg-slate-800/50');
                btnSelecionado.classList.add('border-red-500', 'bg-slate-800');
            }

            const tagsSet = new Set(time.tags.map(t => t.trim().toLowerCase()));
            const filtrados = listaCompleta
                .filter(p => extrairTagsDoPrefix(p.prefix).some(t => tagsSet.has(t)))
                .sort((a, b) => a.gamerTag.localeCompare(b.gamerTag, 'pt-BR', { sensitivity: 'base' }));
            inputBusca.value = '';
            if (filtrados.length === 0) {
                resultadosDiv.innerHTML = `<div class="text-slate-500 text-sm text-center py-8">Nenhum player com o time "${time.label}" encontrado.</div>`;
                return;
            }
            renderizarLista(filtrados);
            resultadosDiv.scrollIntoView({ behavior: 'smooth', block: 'start' });
        };

        function atualizarContador() {
            try {
                const lista = listaCompleta;
                contadorSalvos.textContent = lista.length;
                if (!listaSalvosDiv.classList.contains('hidden')) {
                    if (lista.length === 0) {
                        conteudoSalvos.innerHTML = '<span class="text-slate-500">Nenhum player salvo.</span>';
                    } else {
                        conteudoSalvos.innerHTML = lista.map(p => 
                            `<span class="block text-xs">${p.prefix ? p.prefix + ' | ' : ''}${p.gamerTag} (${p.playerId})</span>`
                        ).join('');
                    }
                }
            } catch (e) {}
        }

        function renderizarLista(lista) {
            const vistos = new Set();
            const unicos = [];
            for (const p of lista) {
                const id = String(p.playerId);
                if (!vistos.has(id)) {
                    vistos.add(id);
                    unicos.push(p);
                }
            }

            if (unicos.length === 0) {
                resultadosDiv.innerHTML = '<div class="text-slate-500 text-sm text-center py-8">Nenhum player encontrado com esse nome.</div>';
                return;
            }
            resultadosDiv.innerHTML = unicos.map(p => {
                const displayName = p.prefix ? `${p.prefix} | ${p.gamerTag}` : p.gamerTag;
                return `
                    <a href="player.html?id=${p.playerId}&tag=${encodeURIComponent(p.gamerTag)}&prefix=${encodeURIComponent(p.prefix || '')}" class="attendee-item flex items-center justify-between hover:bg-white/5 transition-colors rounded-lg px-3">
                        <span class="attendee-name">${displayName}</span>
                        <span class="text-slate-500 text-xs">Ver perfil &rarr;</span>
                    </a>
                `;
            }).join('');
        }

        async function carregarDados() {
            resultadosDiv.innerHTML = '<div class="loading-attendees"><div class="spinner"></div><p style="margin-top:15px;">Carregando players...</p></div>';
            listaCompleta = await carregarPlayersConhecidos();
            resultadosDiv.innerHTML = '<div class="text-slate-500 text-sm text-center py-8">Digite um nome para buscar</div>';
            atualizarContador();
            renderizarGridTimes();
        }

        let timeoutId;
        inputBusca.addEventListener('input', () => {
            clearTimeout(timeoutId);
            timeoutId = setTimeout(() => {
                const termo = inputBusca.value.trim();
                if (termo === '') {
                    resultadosDiv.innerHTML = '<div class="text-slate-500 text-sm text-center py-8">Digite um nome para buscar</div>';
                    return;
                }
                const filtrados = filtrarPlayers(listaCompleta, termo);
                renderizarLista(filtrados);
            }, 300);
        });

        btnMostrar.addEventListener('click', () => {
            listaSalvosDiv.classList.toggle('hidden');
            if (!listaSalvosDiv.classList.contains('hidden')) {
                atualizarContador();
            }
        });

        btnMostrarTimes.addEventListener('click', () => {
            gridTimesDiv.classList.toggle('hidden');
        });

        carregarDados();
    </script>
</body>
</html>
