<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ranking BR | FGC HUB</title>
    <meta name="description" content="Ranking brasileiro de Fighting Games, atualizado automaticamente a cada 6 horas.">
    <link rel="stylesheet" href="themes.css">
    <script src="theme.js"></script>
    <style>
        :root {
            --bg: #0b0b0d;
            --panel: #131316;
            --line: #26262b;
            --line-soft: #1b1b1f;
            --text: #e7e7ea;
            --muted: #85858f;
            --accent: #dc2626;
            --online: #3b82f6;
        }
        * { box-sizing: border-box; }
        html, body { margin: 0; }
        body {
            background: var(--bg);
            color: var(--text);
            font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            min-height: 100vh;
        }
        a { color: inherit; }
        .wrap { max-width: 860px; margin: 0 auto; padding: 20px 16px 56px; }

        .topbar { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 28px; font-size: 13px; }
        .topbar a { color: var(--muted); text-decoration: none; white-space: nowrap; }
        .topbar a:hover { color: var(--text); }

        header.head { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap; padding-bottom: 14px; border-bottom: 1px solid var(--line); }
        h1 { margin: 0; font-size: 24px; font-weight: 700; letter-spacing: -.01em; }
        .meta { color: var(--muted); font-size: 12.5px; text-align: right; }
        .meta b { color: var(--text); font-weight: 600; }

        .tabs { display: flex; gap: 22px; border-bottom: 1px solid var(--line); overflow-x: auto; scrollbar-width: none; }
        .tabs::-webkit-scrollbar { display: none; }
        .tabs button {
            appearance: none; background: none; border: 0; border-bottom: 2px solid transparent; margin-bottom: -1px;
            color: var(--muted); font: inherit; font-weight: 600; padding: 12px 0; cursor: pointer; white-space: nowrap;
        }
        .tabs button:hover { color: var(--text); }
        .tabs button[aria-selected="true"] { color: var(--text); border-bottom-color: var(--accent); }

        .toolbar { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; padding: 14px 0; }
        .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 4px; overflow: hidden; }
        .seg button { appearance: none; background: transparent; border: 0; border-right: 1px solid var(--line); color: var(--muted); font: inherit; font-size: 12.5px; font-weight: 600; padding: 7px 16px; cursor: pointer; }
        .seg button:last-child { border-right: 0; }
        .seg button:hover { color: var(--text); }
        .seg button[aria-pressed="true"] { background: var(--panel); color: var(--text); box-shadow: inset 0 -2px 0 var(--accent); }
        .seg button[aria-pressed="true"][data-m="online"] { box-shadow: inset 0 -2px 0 var(--online); }

        .search { background: var(--panel); border: 1px solid var(--line); border-radius: 4px; color: var(--text); font: inherit; padding: 7px 10px; width: 200px; max-width: 100%; }
        .search::placeholder { color: var(--muted); }
        .search:focus { outline: 0; border-color: #3b3b42; }

        .info { color: var(--muted); font-size: 12.5px; padding-bottom: 8px; display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }

        table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
        thead th { position: sticky; top: 0; background: var(--bg); color: var(--muted); font-size: 11.5px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; padding: 8px 10px; text-align: left; border-bottom: 1px solid var(--line); }
        td { padding: 10px; border-bottom: 1px solid var(--line-soft); }
        .r { text-align: right; }
        .pos { width: 48px; color: var(--muted); }
        tr.p { cursor: pointer; }
        tr.p:hover td { background: var(--panel); }
        tr.p td:first-child { box-shadow: inset 2px 0 0 transparent; }
        tr.p.t1 td:first-child, tr.p.t2 td:first-child, tr.p.t3 td:first-child { color: var(--text); font-weight: 700; }
        tr.p.t1 td:first-child { box-shadow: inset 2px 0 0 #d4a72c; }
        tr.p.t2 td:first-child { box-shadow: inset 2px 0 0 #9ca3af; }
        tr.p.t3 td:first-child { box-shadow: inset 2px 0 0 #a5683a; }
        .tag { font-weight: 600; }
        .pts { font-weight: 700; }
        tr.p.open td { background: var(--panel); border-bottom-color: transparent; }

        tr.d td { padding: 0 10px 12px 58px; background: var(--panel); }
        .hist { width: 100%; font-size: 12.5px; color: var(--muted); }
        .hist td { padding: 5px 8px 5px 0; border-bottom: 1px solid var(--line-soft); background: none !important; }
        .hist td.r { padding-right: 0; }
        .hist .ev { color: var(--text); }

        .msg { padding: 40px 0; text-align: center; color: var(--muted); }
        .rules { margin-top: 28px; padding-top: 14px; border-top: 1px solid var(--line); color: var(--muted); font-size: 12px; }

        @media (max-width: 560px) {
            h1 { font-size: 20px; }
            .meta { text-align: left; }
            .hide-s { display: none; }
            tr.d td { padding-left: 10px; }
            .search { width: 100%; }
        }
    </style>
</head>
<body>
    <div class="wrap">
        <div class="topbar">
            <a href="index.html">&larr; FGC HUB</a>
            <span id="theme-switcher"></span>
        </div>

        <header class="head">
            <h1>Ranking Brasil</h1>
            <div class="meta" id="meta">Carregando…</div>
        </header>

        <div class="tabs" id="jogos" role="tablist" aria-label="Jogo"></div>

        <div class="toolbar">
            <div class="seg" id="modos" role="group" aria-label="Formato">
                <button type="button" data-m="online" aria-pressed="true">Online</button>
                <button type="button" data-m="offline" aria-pressed="false">Offline</button>
                <button type="button" data-m="ambos" aria-pressed="false">Ambos</button>
            </div>
            <input class="search" id="busca" type="search" placeholder="Filtrar player" autocomplete="off" aria-label="Filtrar player">
        </div>

        <div class="info"><span id="contagem"></span><span>Clique no player para ver os eventos</span></div>

        <div id="msg" class="msg" hidden></div>
        <table id="tabela" hidden>
            <thead><tr>
                <th class="pos">#</th><th>Player</th>
                <th class="r">Pontos</th><th class="r hide-s">Eventos</th><th class="r hide-s">Melhor</th>
            </tr></thead>
            <tbody id="corpo"></tbody>
        </table>

        <div class="rules">Pontuação por colocação: 1º 16 · 2º 12 · 3º 10 · 4º 8 · 5º–7º 6 · 8º–12º 4 · 13º–16º 2. Somente eventos com o mínimo de inscritos indicado; eventos por equipe não contam.</div>
    </div>

<script>
(function () {
    'use strict';
    var BASE = 'data/ranking/';
    var $ = function (id) { return document.getElementById(id); };
    var esc = function (s) { return String(s).replace(/[&<>"']/g, function (c) { return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]; }); };
    var norm = function (s) { return String(s).normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase(); };
    var qs = new URLSearchParams(location.search);

    var games = [], slug = null, filtro = '';
    var mode = ['online', 'offline', 'ambos'].indexOf(qs.get('modo')) >= 0 ? qs.get('modo') : 'online';
    var cache = {};

    function getJson(file) {
        return fetch(BASE + file, { cache: 'no-cache' }).then(function (r) {
            if (!r.ok) throw new Error('HTTP ' + r.status);
            return r.json();
        });
    }

    function setUrl() {
        var u = new URL(location.href);
        u.searchParams.set('jogo', slug);
        u.searchParams.set('modo', mode);
        history.replaceState(null, '', u);
    }

    function renderTabs() {
        var box = $('jogos');
        box.innerHTML = '';
        games.forEach(function (g) {
            var b = document.createElement('button');
            b.type = 'button';
            b.setAttribute('role', 'tab');
            b.setAttribute('aria-selected', g.slug === slug ? 'true' : 'false');
            b.textContent = g.name;
            b.onclick = function () { slug = g.slug; renderTabs(); load(); };
            box.appendChild(b);
        });
    }

    function renderModes() {
        document.querySelectorAll('#modos button').forEach(function (b) {
            b.setAttribute('aria-pressed', b.dataset.m === mode ? 'true' : 'false');
        });
    }

    function showMsg(t) {
        $('msg').textContent = t;
        $('msg').hidden = false;
        $('tabela').hidden = true;
        $('contagem').textContent = '';
    }

    function load() {
        setUrl();
        var p = cache[slug] ? Promise.resolve(cache[slug]) : getJson(slug + '.json').then(function (d) { return (cache[slug] = d); });
        p.then(render).catch(function () { showMsg('Ranking ainda não disponível para este jogo.'); });
    }

    function render() {
        var d = cache[slug], m = d.modes[mode];
        var upd = new Date(d.updatedAt).toLocaleString('pt-BR', { dateStyle: 'short', timeStyle: 'short' });
        var from = new Date(d.from + 'T12:00:00').toLocaleDateString('pt-BR');
        $('meta').innerHTML = 'Desde <b>' + from + '</b> · atualizado em <b>' + upd + '</b>';

        var f = norm(filtro.trim());
        var list = f ? m.players.filter(function (o) { return norm(o.tag).indexOf(f) >= 0; }) : m.players;

        $('contagem').textContent = m.events + ' eventos (mín. ' + d.minEntrants + ' inscritos) · ' +
            (f ? list.length + ' de ' + m.players.length : m.players.length) + ' players';

        var body = $('corpo');
        body.innerHTML = '';
        if (!list.length) { showMsg(f ? 'Nenhum player encontrado.' : 'Sem dados para este formato.'); return; }
        $('msg').hidden = true;
        $('tabela').hidden = false;

        var frag = document.createDocumentFragment();
        list.forEach(function (o) {
            var tr = document.createElement('tr');
            tr.className = 'p' + (o.pos <= 3 ? ' t' + o.pos : '');
            tr.innerHTML = '<td class="pos">' + o.pos + '</td><td class="tag">' + esc(o.tag) + '</td>' +
                '<td class="r pts">' + o.pts + '</td><td class="r hide-s">' + o.n + '</td><td class="r hide-s">' + o.best + 'º</td>';
            var det = null;
            tr.onclick = function () {
                if (det) { det.remove(); det = null; tr.classList.remove('open'); return; }
                det = document.createElement('tr');
                det.className = 'd';
                var rows = o.list.map(function (x) {
                    return '<tr><td>' + new Date(x.d * 1000).toLocaleDateString('pt-BR') + '</td>' +
                        '<td class="ev">' + esc(x.n) + '</td>' +
                        '<td class="r">' + x.p + 'º de ' + x.e + '</td><td class="r">+' + x.pts + '</td></tr>';
                }).join('');
                det.innerHTML = '<td colspan="5"><table class="hist"><tbody>' + rows + '</tbody></table></td>';
                tr.classList.add('open');
                tr.after(det);
            };
            frag.appendChild(tr);
        });
        body.appendChild(frag);
    }

    $('modos').addEventListener('click', function (e) {
        var b = e.target.closest('button');
        if (!b) return;
        mode = b.dataset.m;
        renderModes();
        setUrl();
        if (cache[slug]) render();
    });
    $('busca').addEventListener('input', function (e) { filtro = e.target.value; if (cache[slug]) render(); });

    renderModes();
    getJson('index.json').then(function (j) { games = j.games || []; }).catch(function () { games = []; }).then(function () {
        if (!games.length) { $('meta').textContent = ''; showMsg('Nenhum ranking disponível ainda.'); return; }
        slug = games.some(function (g) { return g.slug === qs.get('jogo'); }) ? qs.get('jogo') : games[0].slug;
        renderTabs();
        load();
    });
})();
</script>
</body>
</html>
