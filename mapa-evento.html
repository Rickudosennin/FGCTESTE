<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Localização do Torneio - FGC HUB</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root { --bg: #16171b; --card: #1f2026; --txt: #eee; --blue: #2f6fe4; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--txt); font-family: system-ui, -apple-system, sans-serif; height: 100vh; overflow: hidden; }
#map { width: 100%; height: 100%; }
.pin-evento { width: 22px; height: 22px; border-radius: 50%; border: 3px solid #fff; box-shadow: 0 0 10px rgba(0,0,0,0.8); background: var(--blue); }
.leaflet-popup-content { color: #111; font-size: 14px; }
.leaflet-popup-content b { font-size: 16px; display: block; margin-bottom: 4px; }
.leaflet-popup-content a { color: var(--blue); font-weight: bold; text-decoration: none; }
.leaflet-control-layers { color: #111; font-family: system-ui, sans-serif; font-size: 13px; font-weight: 500; }
.overlay-info { position: absolute; top: 15px; left: 15px; z-index: 1000; background: var(--card); padding: 15px; border-radius: 10px; border: 1px solid #33353e; box-shadow: 0 4px 15px rgba(0,0,0,0.5); max-width: 320px; }
.overlay-info h2 { margin: 0 0 8px 0; font-size: 16px; color: #fff; }
.overlay-info p { margin: 0 0 12px 0; font-size: 13px; color: #aaa; }
.btn-voltar { background: #33353e; color: #fff; padding: 8px 12px; border-radius: 6px; text-decoration: none; font-size: 12px; font-weight: bold; display: inline-block; transition: 0.2s; }
.btn-voltar:hover { background: #4a4d5a; }
/* Ajusta a posição do controle de camadas no mapa de eventos para não sobrepor o botão de voltar em telas pequenas */
@media(max-width:600px) { .overlay-info { top: auto; bottom: 20px; } }
</style>
</head>
<body>

<div class="overlay-info" id="info-box">
  <h2 id="evento-nome">Carregando mapa...</h2>
  <p id="evento-endereco">Buscando endereço exato...</p>
  <a href="javascript:window.close();" class="btn-voltar">← Voltar / Fechar Mapa</a>
</div>

<div id="map"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
const p = new URLSearchParams(location.search);
const nome = p.get('nome') || 'Evento FGC';
const cidade = p.get('cidade') || '';
const uf = p.get('uf') || '';
const endereco = p.get('endereco') || '';
const pLat = p.get('lat');
const pLng = p.get('lng');
const url = p.get('url') || '#';

const esc = s => String(s??"").replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

document.getElementById('evento-nome').innerText = nome;
const textoEndereco = endereco ? `${endereco} - ${cidade}/${uf}` : `${cidade}/${uf}`;
document.getElementById('evento-endereco').innerText = "📍 " + textoEndereco;

const map = L.map("map").setView([-14.2, -51.9], 4);

// Definição das 3 opções de mapa
const camadaEscura = L.tileLayer("https://{s}.basemaps.cartocdn.com/rastertiles/dark_all/{z}/{x}/{y}{r}.png?key=cb1_4w1g_1_3040de64ae82136aecda67bf", { attribution: "&copy; CARTO", maxZoom: 19 });
const camadaPadrao = L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", { attribution: "&copy; OpenStreetMap", maxZoom: 19 });
const camadaSatelite = L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}", { attribution: "&copy; Esri", maxZoom: 19 });

// Adiciona a camada escura como padrão ao abrir
camadaEscura.addTo(map);

// Cria o controle de seleção
L.control.layers({
  "Mapa Escuro": camadaEscura,
  "Mapa Padrão": camadaPadrao,
  "Satélite": camadaSatelite
}).addTo(map);

const iconEvento = L.divIcon({ className: "", html: `<div class="pin-evento"></div>`, iconSize: [22, 22] });

function adicionarPino(lat, lng) {
  map.setView([lat, lng], 16);
  const popupHtml = `<b>${esc(nome)}</b>📍 ${esc(textoEndereco)}<br><br><a href="${esc(url)}" target="_blank">Ver no Start.gg</a>`;
  L.marker([lat, lng], {icon: iconEvento}).addTo(map).bindPopup(popupHtml).openPopup();
}

async function carregarMapa() {
  if (pLat && pLng && pLat !== "null" && pLng !== "null") {
    adicionarPino(parseFloat(pLat), parseFloat(pLng));
    return;
  }
  if (endereco || cidade) {
    const buscaStr = `${endereco ? endereco + ', ' : ''}${cidade}, Brasil`;
    try {
      const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&country=Brazil&q=${encodeURIComponent(buscaStr)}`);
      const data = await res.json();
      if (data && data.length > 0) {
        adicionarPino(parseFloat(data[0].lat), parseFloat(data[0].lon));
      } else {
        document.getElementById('evento-endereco').innerText += " (Local exato não encontrado no satélite)";
      }
    } catch(e) {
      console.error("Erro na busca de endereço", e);
    }
  }
}

carregarMapa();
</script>
</body>
</html>
