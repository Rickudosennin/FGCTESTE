name: Atualizar Ranking & Eventos

on:
  schedule:
    - cron: '0 6 * * *'   # todo dia às 06:00 (horário de Brasília ≈ UTC-3)
  workflow_dispatch:       # permite rodar manualmente pela aba Actions

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependências
        run: npm ci

      - name: Buscar dados do start.gg
        env:
          STARTGG_TOKEN: ${{ secrets.STARTGG_TOKEN }}
        run: npm run fetch:all

      - name: Commit e push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "Nenhuma alteração para commitar."
          else
            git commit -m "chore: atualizar ranking e eventos [skip ci]"
            git push
          fi
