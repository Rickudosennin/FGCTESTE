name: Atualizar rankings

on:
  schedule:
    - cron: '0 */6 * * *'   # a cada 6 horas (UTC)
  workflow_dispatch:         # botão "Run workflow" manual

permissions:
  contents: write

concurrency:
  group: update-ranking
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Gerar rankings
        env:
          STARTGG_TOKEN: ${{ secrets.STARTGG_TOKEN }}
        run: node scripts/update-ranking.js

      - name: Commit se mudou
        run: |
          git config user.name "fgchub-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/ranking
          if git diff --cached --quiet; then
            echo "Sem mudanças"
          else
            git commit -m "chore: atualiza rankings"
            git pull --rebase
            git push
          fi
